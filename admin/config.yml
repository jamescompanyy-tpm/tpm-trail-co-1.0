# ═══════════════════════════════════════════════════
#  TPM Trail Co. — CMS configuration
#  Field names below MUST match the frontmatter keys that
#  netlify/functions/get-posts.js reads. Renaming one here
#  without updating that function will drop it from the site.
# ═══════════════════════════════════════════════════

backend:
  name: github
  # Must match the repo Netlify deploys this site from, and the GITHUB_REPO
  # env var that netlify/functions/get-posts.js reads. All three must agree.
  repo: jamescompanyy-tpm/tpm-trail-co-1.0
  branch: main

# Where images dragged into the editor get committed
media_folder: "images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "Trail Journal"
    label_singular: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}  ·  {{date}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish date"
        name: "date"
        widget: "datetime"
        format: "MMMM D, YYYY"        # written to the file — matches existing posts
        date_format: "MMMM D, YYYY"   # shown in the picker
        time_format: false
        hint: "Shown on the post card exactly as formatted here."

      - label: "Category"
        name: "category"
        widget: "select"
        default: "Trail Stories"
        options:
          - "Trail Stories"
          - "Ecology"
          - "Gear"
        hint: "Drives the Journal filter buttons. These three values only."

      - label: "Feature this post"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "The featured post gets the large card at the top. Only turn this on for one post."

      - label: "Read time"
        name: "readTime"
        widget: "string"
        default: "5 min read"

      - label: "Author"
        name: "author"
        widget: "string"
        default: "James Rivera"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "The teaser shown on the post card. Two or three sentences."

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Press Enter after each tag."

      - label: "Card artwork"
        name: "gradient"
        widget: "select"
        default: "linear-gradient(135deg, #1c3a28 0%, #2d5a3d 40%, #4a7c59 100%)"
        hint: "Posts use a colour gradient instead of a photo on the card."
        options:
          - label: "Deep forest (green)"
            value: "linear-gradient(135deg, #1c3a28 0%, #2d5a3d 40%, #4a7c59 100%)"
          - label: "Meadow (light green)"
            value: "linear-gradient(135deg, #2d5a3d 0%, #4a7c59 60%, #7aaa85 100%)"
          - label: "Earth (brown / clay)"
            value: "linear-gradient(135deg, #3d2b1f 0%, #6b4c35 50%, #c4956a 100%)"
          - label: "Pre-dawn (near black)"
            value: "linear-gradient(135deg, #0d2018 0%, #1c3a28 40%, #4a7c59 100%)"
          - label: "Sage (pale green)"
            value: "linear-gradient(135deg, #4a7c59 0%, #7aaa85 50%, #b5cdb8 100%)"
          - label: "Sand (warm tan)"
            value: "linear-gradient(135deg, #6b4c35 0%, #c4956a 60%, #e8d5b7 100%)"

      - label: "Post"
        name: "body"
        widget: "markdown"
        hint: "Supports headings, bold, italic, quotes, bullet lists, links and images."

  # ── 2027 Trips ──────────────────────────────────────
  # Edits one JSON file. The /trips page reads the same file, so saving here
  # commits to the repo and the page updates on the next deploy.
  # Every field is optional — anything left blank shows as "TBA" on the page.
  - name: "trips2027"
    label: "2027 Trips"
    files:
      - name: "trips"
        label: "2027 Trip List"
        file: "data/trips-2027.json"
        description: "Add, edit, reorder or delete the trips shown on /trips."
        fields:
          - label: "Trips"
            label_singular: "Trip"
            name: "trips"
            widget: "list"
            required: false
            summary: "{{fields.name}} — {{fields.state}} · {{fields.status}}"
            fields:
              - label: "Trip name"
                name: "name"
                widget: "string"
                required: false

              - label: "Experience type"
                name: "type"
                widget: "select"
                required: false
                options:
                  - "Guided Hike — Half Day"
                  - "Guided Hike — Full Day"
                  - "Overnight Backpacking"
                  - "Team Retreat"
                hint: "Drives the filter buttons on the page. These four values only."

              - label: "Location"
                name: "location"
                widget: "string"
                required: false
                hint: "Trail or area, e.g. Sleeping Giant State Park."

              - label: "State"
                name: "state"
                widget: "select"
                required: false
                options: ["CT", "MA", "NH", "VT"]

              - label: "Dates"
                name: "dates"
                widget: "list"
                required: false
                hint: "One entry per date or date range. Press Enter after each."

              - label: "Duration"
                name: "duration"
                widget: "string"
                required: false
                hint: "Free text, e.g. Half day, Full day, 2 nights."

              - label: "Difficulty"
                name: "difficulty"
                widget: "string"
                required: false

              - label: "Distance"
                name: "distance"
                widget: "string"
                required: false

              - label: "Elevation gain"
                name: "elevationGain"
                widget: "string"
                required: false

              - label: "Group size"
                name: "maxGroupSize"
                widget: "string"
                required: false

              - label: "Price per person"
                name: "price"
                widget: "string"
                required: false
                hint: "Flat per-person price for this trip, e.g. 145. Shown as \"$145 / person\"."

              - label: "Spots remaining"
                name: "spotsRemaining"
                widget: "string"
                required: false
                hint: "Optional. Left blank, the row is hidden rather than showing TBA."

              - label: "Trip detail or itinerary link"
                name: "link"
                widget: "string"
                required: false
                hint: "Optional. Adds a link on the card."

              - label: "Status"
                name: "status"
                widget: "select"
                required: false
                default: "open"
                options: ["open", "waitlist", "full"]
                hint: "open = bookable · waitlist = request goes on the waitlist · full = shown but not selectable."
